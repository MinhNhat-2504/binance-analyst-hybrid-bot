# Workflow CI tối thiểu: chạy pytest mỗi lần push hoặc mở pull request.
# Cách dùng: chép file này vào <repo>/.github/workflows/ci.yml rồi push.
# Badge trong README: https://github.com/<user>/<repo>/actions/workflows/ci.yml/badge.svg
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
